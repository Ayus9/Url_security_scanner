<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scan Report — URL Security Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    .report-page { max-width: 860px; margin: 0 auto; padding: 40px 20px; }
    .report-header { border-bottom: 2px solid #00ff6a33; padding-bottom: 20px; margin-bottom: 30px; }
    .report-title { font-family: 'Orbitron', monospace; font-size: 20px; color: #00ff6a; letter-spacing: 3px; }
    .report-meta  { font-size: 12px; color: #4a7a5a; margin-top: 8px; line-height: 2; }
    .report-section { margin-bottom: 30px; }
    .report-section h2 { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 3px;
      color: #00ff6a88; margin-bottom: 12px; border-bottom: 1px solid #00ff6a18; padding-bottom: 6px; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .report-table th { text-align: left; color: #4a7a5a; padding: 6px 10px;
      border-bottom: 1px solid #00ff6a22; font-family: 'Orbitron', monospace; font-size: 10px; }
    .report-table td { padding: 8px 10px; border-bottom: 1px solid #00ff6a0d; color: #c8ffd4; vertical-align: top; }
    .report-table tr:hover td { background: #00ff6a06; }
    .risk-badge-report { display: inline-block; padding: 4px 12px;
      font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .print-btn { background: linear-gradient(135deg,#00ff6a,#00c9a0); color: #030a0e;
      border: none; padding: 12px 28px; font-family: 'Orbitron', monospace; font-weight: 700;
      font-size: 11px; letter-spacing: 2px; cursor: pointer; margin-right: 12px; }
    .back-btn { background: transparent; border: 1px solid #00ff6a44; color: #00ff6a;
      padding: 12px 28px; font-family: 'Orbitron', monospace; font-size: 11px;
      letter-spacing: 2px; cursor: pointer; text-decoration: none; display: inline-block; }
    @media print {
      body { background: white; color: black; }
      canvas, .scan-line, header, footer, .print-btn, .back-btn { display: none !important; }
      .card { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div class="wrapper report-page">
    <div class="report-header">
      <div class="report-title">◈ SECURITY SCAN REPORT</div>
      <div class="report-meta" id="report-meta">Loading report data…</div>
    </div>

    <div class="report-section">
      <h2>Risk Summary</h2>
      <div id="report-risk"></div>
    </div>

    <div class="report-section">
      <h2>Issues Detected</h2>
      <table class="report-table">
        <thead><tr><th>Category</th><th>Severity</th><th>Description</th></tr></thead>
        <tbody id="report-issues"></tbody>
      </table>
    </div>

    <div class="report-section">
      <h2>Security Checks</h2>
      <table class="report-table">
        <thead><tr><th>Check</th><th>Result</th></tr></thead>
        <tbody id="report-checks"></tbody>
      </table>
    </div>

    <div class="report-section" id="report-vt-section" style="display:none">
      <h2>VirusTotal Results</h2>
      <div id="report-vt"></div>
    </div>

    <div class="report-section" id="report-zap-section" style="display:none">
      <h2>OWASP ZAP Alerts</h2>
      <table class="report-table">
        <thead><tr><th>Alert</th><th>Risk</th><th>CWE</th><th>Description</th></tr></thead>
        <tbody id="report-zap"></tbody>
      </table>
    </div>

    <div class="report-section">
      <h2>Recommendations</h2>
      <ul id="report-recs" style="color:#a0c8b0;font-size:13px;line-height:2;padding-left:20px"></ul>
    </div>

    <div style="margin-top:30px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="print-btn" onclick="window.print()">🖨 Print Report</button>
      <a class="back-btn" href="/">← Back to Scanner</a>
    </div>

    <footer class="site-footer" style="margin-top:40px">
      ⚠ EDUCATIONAL &amp; SECURITY AWARENESS PURPOSES ONLY
    </footer>
  </div>
  <script src="{{ url_for('static', filename='js/matrix.js') }}"></script>
  <script src="{{ url_for('static', filename='js/report.js') }}"></script>
</body>
</html>
